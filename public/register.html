<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register - Alfaaz</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Register for Alfaaz</h1>
  <p class="subtitle">Choose how you'd like to register</p>

  <div class="toggle">
    <button id="btn-personal" class="active" onclick="setMode('personal')">Individual</button>
    <button id="btn-college" onclick="setMode('college')">College</button>
  </div>

  <div class="card">
    <!-- PERSONAL FORM -->
    <form id="form-personal">
      <label>Full Name</label>
      <input type="text" id="p-name" required>

      <label>Email</label>
      <input type="email" id="p-email" required>

      <label>Phone</label>
      <input type="tel" id="p-phone">

      <label>Password</label>
      <input type="password" id="p-password" minlength="6" required>

      <button type="submit" class="primary">Register</button>
    </form>

    <!-- COLLEGE FORM -->
    <form id="form-college" class="hidden">
      <label>College Name</label>
      <input type="text" id="c-college-name" required>

      <label>Your Name (Coordinator / Admin)</label>
      <input type="text" id="c-admin-name" required>

      <label>Email</label>
      <input type="email" id="c-email" required>

      <label>Phone</label>
      <input type="tel" id="c-phone">

      <label>Password</label>
      <input type="password" id="c-password" minlength="6" required>

      <label>Participants</label>
      <div id="participant-list"></div>
      <button type="button" class="add-btn" onclick="addParticipantRow()">+ Add participant</button>

      <button type="submit" class="primary">Register College</button>
    </form>

    <div id="msg" class="msg hidden"></div>
  </div>

  <p class="footer-link">Already have an account? <a href="/login.html">Log in</a></p>

<script>
function setMode(mode) {
  document.getElementById('form-personal').classList.toggle('hidden', mode !== 'personal');
  document.getElementById('form-college').classList.toggle('hidden', mode !== 'college');
  document.getElementById('btn-personal').classList.toggle('active', mode === 'personal');
  document.getElementById('btn-college').classList.toggle('active', mode === 'college');
}

function addParticipantRow() {
  const list = document.getElementById('participant-list');
  const row = document.createElement('div');
  row.className = 'participant-row';
  row.innerHTML = `
    <input type="text" placeholder="Participant name" class="pt-name" required>
    <input type="email" placeholder="Participant email" class="pt-email" required>
    <button type="button" class="remove-btn" onclick="this.parentElement.remove()">✕</button>
  `;
  list.appendChild(row);
}
// Start with one participant row for college form
addParticipantRow();

function showMsg(text, success) {
  const el = document.getElementById('msg');
  el.textContent = text;
  el.className = 'msg ' + (success ? 'success' : 'error');
  el.classList.remove('hidden');
}

document.getElementById('form-personal').addEventListener('submit', async (e) => {
  e.preventDefault();
  const body = {
    role: 'personal',
    name: document.getElementById('p-name').value,
    email: document.getElementById('p-email').value,
    phone: document.getElementById('p-phone').value,
    password: document.getElementById('p-password').value,
  };
  await submitRegistration(body);
});

document.getElementById('form-college').addEventListener('submit', async (e) => {
  e.preventDefault();
  const participants = [...document.querySelectorAll('#participant-list .participant-row')].map(row => ({
    name: row.querySelector('.pt-name').value,
    email: row.querySelector('.pt-email').value,
  }));
  const body = {
    role: 'college',
    collegeName: document.getElementById('c-college-name').value,
    adminName: document.getElementById('c-admin-name').value,
    email: document.getElementById('c-email').value,
    phone: document.getElementById('c-phone').value,
    password: document.getElementById('c-password').value,
    participants,
  };
  await submitRegistration(body);
});

async function submitRegistration(body) {
  try {
    const res = await fetch('/api/auth/register', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    const data = await res.json();
    if (!res.ok) {
      showMsg(data.error || 'Registration failed', false);
      return;
    }
    let text = data.message;
    if (data.devVerifyUrl) {
      text += ` (Dev mode — no SMTP configured. Verify here: ${data.devVerifyUrl})`;
    }
    showMsg(text, true);
  } catch (err) {
    showMsg('Network error. Please try again.', false);
  }
}
</script>
</body>
</html>
